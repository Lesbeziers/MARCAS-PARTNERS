<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Herramienta interna alojada temporalmente en un repositorio público.
     Se pide a los buscadores que no la indexen ni sigan sus enlaces: no
     impide el acceso a quien tenga la URL, pero evita que se llegue aquí
     por casualidad desde una búsqueda. Retirar cuando pase a privado. -->
<meta name="robots" content="noindex, nofollow">
<title>Marcas Partners · Movistar Plus+</title>

<!-- ======================= IMPORTANTE AL ACTUALIZAR =======================
     El servidor sirve el CSS y el JS con 14 días de caché y sin revalidar,
     así que un navegador que ya haya entrado seguirá usando la versión
     antigua durante dos semanas por mucho que se suba la nueva.

     El HTML, en cambio, revalida cada 2 horas. Por eso las rutas llevan
     ?v=FECHA: al cambiar ese número cambia la dirección, el navegador no
     la tiene guardada y descarga el archivo nuevo.

     >>> SUBIR UNA VERSIÓN NUEVA = CAMBIAR ESTA FECHA EN LAS 4 RUTAS <<<
     Si no se cambia, nadie verá los cambios hasta pasados 14 días.
     ======================================================================= -->
<link rel="stylesheet" href="assets/css/fonts.css?v=20261023">
<link rel="stylesheet" href="assets/css/style.css?v=20261023">
</head>
<body>

<header class="cabecera">
  <img src="assets/img/cabecera_marcas_partners.svg" alt="Marcas Partners · Movistar Plus+">
</header>

<!-- ======================= PANTALLA 1 · LANDING ======================= -->
<main class="landing" id="landing">
  <div class="dropzone" id="dropzone" role="button" tabindex="0"
       aria-label="Arrastra aquí las imágenes o haz click para seleccionarlas">
    <p class="dz-titulo">Arrastra aquí las imágenes</p>
    <p class="dz-sub">o haz click para seleccionarlas</p>
  </div>
  <input type="file" id="input-archivos" accept="image/*" multiple hidden>
</main>

<!-- ==================== PANTALLA 2 · ÁREA DE TRABAJO =================== -->
<div class="trabajo" id="trabajo" hidden>

  <nav class="barra">
    <div class="barra-grupo">
      <button type="button" class="btn" id="btn-inicio">INICIO</button>
      <button type="button" class="btn" id="btn-reiniciar">REINICIAR</button>
      <button type="button" class="btn btn-exportar" id="btn-exportar">EXPORTAR</button>
    </div>
    <div class="barra-grupo">
      <button type="button" class="btn" id="btn-anterior" title="Anterior (flecha izquierda)">ANTERIOR</button>
      <button type="button" class="btn" id="btn-siguiente" title="Siguiente (flecha derecha)">SIGUIENTE</button>
    </div>
  </nav>

  <div class="cuerpo">

    <aside class="lateral">
      <h2 class="titulo-seccion">SELECTOR DE MARCAS</h2>
      <div class="select-caja">
        <select class="select" id="selector-modo" aria-label="Modo de aplicación de marcas"></select>
      </div>

      <h2 class="titulo-seccion">IMÁGENES</h2>
      <ul class="lista" id="lista"></ul>
    </aside>

    <section class="viewport">
      <div class="viewport-control">
        <!-- Modo VARIAS: desplegable por carátula -->
        <div class="select-caja" id="caja-marca">
          <select class="select" id="selector-marca" aria-label="Marca de esta carátula"></select>
        </div>
        <!-- Modo partner: rótulo fijo -->
        <p class="rotulo-marca" id="rotulo-marca" hidden></p>
      </div>

      <div class="lienzos" id="lienzos">
        <figure class="lienzo lienzo--v" id="lienzo-v"></figure>
        <figure class="lienzo lienzo--h" id="lienzo-h"></figure>
      </div>
    </section>

  </div>
</div>

<!-- ============================ MODAL ============================ -->
<div class="velo" id="modal" hidden>
  <div class="modal-caja" role="alertdialog" aria-modal="true" aria-labelledby="modal-texto">
    <p class="modal-texto" id="modal-texto"></p>
    <div class="modal-botones">
      <button type="button" class="btn" id="modal-cancelar">CANCELAR</button>
      <button type="button" class="btn btn-peligro" id="modal-aceptar">CONTINUAR</button>
    </div>
  </div>
</div>

<!-- ========================= PROGRESO EXPORT ========================= -->
<div class="velo" id="progreso" hidden>
  <div class="modal-caja">
    <p class="modal-texto" id="progreso-texto">Exportando…</p>
    <div class="barra-progreso"><div class="barra-progreso-relleno" id="progreso-relleno"></div></div>
  </div>
</div>

<script src="assets/js/jszip.min.js?v=20261023"></script>
<script src="assets/js/marcas.js?v=20261023"></script>
<script src="assets/js/app.js?v=20261023"></script>
</body>
</html>
